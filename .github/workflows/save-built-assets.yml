name: Save Built Assets

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: save-built-assets-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  save:
    name: Build and cache assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: "production"
      DB_ROOT_PASSWORD: db_root
    services:
      mariadb:
        image: mariadb:11.8
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3 --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          python-version: '3.14'
          node-version: 24
          build-assets: true
          db-root-password: ${{ env.DB_ROOT_PASSWORD }}
          db: mariadb
