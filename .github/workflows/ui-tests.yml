name: UI

on:
  pull_request:
  workflow_dispatch:
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"

concurrency:
  group: ui-develop-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  # Do not change this as GITHUB_TOKEN is being used by roulette
  contents: read
  actions: read

jobs:
  checkrun:
    name: Plan Tests
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'Skip CI') || contains(github.event.pull_request.labels.*.name, 'Run UI Tests') }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check-build.outputs.build }}
      specs: ${{ steps.check-build.outputs.specs }}
      shards: ${{ steps.check-build.outputs.shards }}
      shard_total: ${{ steps.check-build.outputs.shard_total }}
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Download UI test impact map
        run: |
          for run_id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow ui-tests.yml --event schedule --branch "$BRANCH" --limit 3 --json databaseId --jq '.[].databaseId'); do
            gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name ui-impact-map && break
          done
          true
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.base_ref || github.ref_name }}
      - name: Check if build should be run
        id: check-build
        run: |
          python "${GITHUB_WORKSPACE}/.github/helper/roulette.py"
        env:
          TYPE: "ui"
          PR_NUMBER: ${{ github.event.number }}
          REPO_NAME: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    name: UI Test
    needs: checkrun
    if: ${{ needs.checkrun.outputs.build == 'strawberry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: "production"
      # noisy 3rd party library warnings
      PYTHONWARNINGS: "ignore"
      DB_ROOT_PASSWORD: db_root

    strategy:
      fail-fast: false
      matrix:
        db: ["mariadb"]
        index: ${{ fromJson(needs.checkrun.outputs.shards || '[1, 2, 3, 4]') }}
    services:
      mariadb:
        image: mariadb:11.8
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3 --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: '3.14'
          node-version: 24
          build-assets: true
          db-root-password: ${{ env.DB_ROOT_PASSWORD }}
          db: ${{ matrix.db }}

      - name: Verify yarn.lock
        run: |
          cd ${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}
          git diff --exit-code yarn.lock studio/frontend/yarn.lock flow/yarn.lock

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frappe/commands/testing.py') }}

      - name: Site Setup
        run: |
          # a second site, so the shard can run two workers without sharing data
          echo "127.0.0.1 test_site_2" | sudo tee -a /etc/hosts
          bench new-site test_site_2 \
            --db-type ${{ matrix.db }} \
            --db-host 127.0.0.1 \
            --db-name test_frappe_2 \
            --db-password test_frappe
          jq -s '.[1] + .[0] + {host_name: "http://test_site_2:8000"}' \
            sites/test_site_2/site_config.json sites/test_site/site_config.json > site_config.json
          mv site_config.json sites/test_site_2/site_config.json

          for site in test_site test_site_2; do
            bench --site $site execute frappe.utils.install.complete_setup_wizard
            bench --site $site execute frappe.tests.ui_test_helpers.create_test_user
          done

      - name: Run Tests
        id: ui-tests
        run: |
          bench --site test_site \
            run-ui-tests ${{ github.event.repository.name }} \
              --headless \
              --parallel-site test_site_2 \
              --shard=${{ matrix.index }}/${{ needs.checkrun.outputs.shard_total || 4 }} \
              $SELECTED_SPECS
        env:
          SELECTED_SPECS: ${{ needs.checkrun.outputs.specs }}
          UI_IMPACT_MAP_DIR: ${{ github.event_name == 'schedule' && format('{0}/ui-impact-map', github.workspace) || '' }}

      - name: Upload UI test impact map
        if: ${{ github.event_name == 'schedule' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-impact-map-${{ matrix.index }}
          path: ui-impact-map/*.json

      - name: Upload Playwright Report
        if: always() && steps.ui-tests.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.index }}
          path: |
            apps/${{ github.event.repository.name }}/playwright-report
            apps/${{ github.event.repository.name }}/test-results

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() && contains( github.event.pull_request.labels.*.name, 'debug-gha') }}

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cat bench_start.log || true
          cd logs
          for f in ${GITHUB_WORKSPACE}/*.log*; do
            echo "Printing log: $f";
            cat $f
          done

  studio:
    name: Studio Component Tests
    needs: checkrun
    if: ${{ needs.checkrun.outputs.build == 'strawberry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # not NODE_ENV=production: yarn would skip the editor's devDependencies, cypress included
      PYTHONWARNINGS: "ignore"
      DB_ROOT_PASSWORD: db_root
    services:
      mariadb:
        image: mariadb:11.8
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3 --tmpfs=/var/lib/mysql:rw,noexec,nosuid,size=2g
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      # the editor's yarn install (part of bench build) downloads the Cypress binary
      - name: Cache Cypress binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('studio/frontend/yarn.lock') }}

      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: '3.14'
          node-version: 24
          build-assets: true
          disable-socketio: true
          disable-workers: true
          db-root-password: ${{ env.DB_ROOT_PASSWORD }}
          db: mariadb

      # the data-source specs call the test site through the dev server's proxy
      - name: Run Component Tests
        run: |
          cd ${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}/studio/frontend
          yarn test:cypress

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: apps/${{ github.event.repository.name }}/studio/frontend/cypress/screenshots

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cat bench_start.log || true

  flow:
    name: Flow Page Tests
    needs: checkrun
    if: ${{ needs.checkrun.outputs.build == 'strawberry' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: flow/yarn.lock

      # node --test alone: the page's tests need no site
      - name: Run Page Tests
        run: |
          cd flow
          yarn install --frozen-lockfile
          yarn test

  impact-map:
    name: UI Impact Map
    needs: test
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: ui-impact-map-*
      - name: Merge UI test impact maps
        run: python .github/helper/impact_map.py merge ui-impact-map.json ui-impact-map-*/*.json
      - name: Publish UI test impact map
        uses: actions/upload-artifact@v7
        with:
          name: ui-impact-map
          path: ui-impact-map.json
          retention-days: 14

  # TIP: Require this single check in branch protection, e.g. UI / Success
  success:
    name: UI Success
    needs: [test, studio, flow]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: UI Test '${{ needs.test.result }}'
        shell: python
        run: |
          stati = [
            '${{ needs.test.result }}',
            '${{ needs.studio.result }}',
            '${{ needs.flow.result }}',
          ]

          nopass = ["failure", "cancelled"]
          dopass = ["success", "skipped"]
          if any(r in nopass for r in stati):
            exit(1)
          if all(r in dopass for r in stati):
            exit(0)
          exit(1)
