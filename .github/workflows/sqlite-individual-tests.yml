name: SQLite Individual

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

concurrency:
  # Another label's event gets its own group, so it cannot cancel a run in progress.
  group: sqlite-individual-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}${{ github.event.action == 'labeled' && github.event.label.name != 'sqlite' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  # Do not change this as GITHUB_TOKEN is being used by roulette
  contents: read

env:
  SHARD_COUNT: 4
  # Test processes that run side by side in one shard, each on its own copy of the site.
  WORKERS: 2

jobs:
  checkrun:
    name: Plan Tests
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
      || (contains(github.event.pull_request.labels.*.name, 'sqlite')
      && (github.event.action != 'labeled' || github.event.label.name == 'sqlite')) }}
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.check-build.outputs.build }}
    steps:
      - name: Clone
        uses: actions/checkout@v7
      - name: Check if unit tests should be run
        id: check-build
        run: |
          python "${GITHUB_WORKSPACE}/.github/helper/roulette.py"
        env:
          TYPE: "server"
          PR_NUMBER: ${{ github.event.number }}
          REPO_NAME: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  discover:
    needs: checkrun
    if: ${{ needs.checkrun.outputs.build == 'strawberry' || contains(github.event.pull_request.labels.*.name, 'sqlite') }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      tests: ${{ steps.set-tests.outputs.tests }}
    steps:
      - uses: actions/checkout@v7
      - id: set-tests
        run: |
          tests=$(find frappe -type f -name 'test_*.py' -print0 | xargs -0 grep -l 'def test_' | awk '{
              gsub(/^\.\//, "", $0)
              gsub(/\.py$/, "", $0)
              gsub(/\//, ".", $0)
              print
          }' | sort | jq -R . | jq -sc .)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
      - id: set-matrix
        run: |
          matrix=$(jq -nc --argjson count "$SHARD_COUNT" '{"include": [range(1; $count + 1) | {"shard": .}]}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  test:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # This profile deliberately has no web server. The setup action exports to avoid deadlock failures
    env:
      NODE_ENV: production
      ALL_TESTS: ${{ needs.discover.outputs.tests }}
      SHARD_INDEX: ${{ matrix.shard }}
      FRAPPE_TEST_SMTP_SERVER: 0
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    name: Integration
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: "3.14"
          node-version: 24
          db: sqlite
          prebuilt-assets: true
          db-root-password: db_root
          disable-web: true
          disable-socketio: true
          # SQLite permits only one writer. Tests run serially in this job, hence disabling workers that can write queued setup jobs.
          disable-workers: true
          enable-server-scripts: false
      - name: Prepare the site for tests
        shell: bash
        # One small module runs the setup wizard and creates the shared test records, so the
        # saved site already has them and the modules below do not each repeat that work.
        run: bench --site test_site run-tests --app frappe --module frappe.tests.test_seen
      - name: Save pristine SQLite site
        shell: bash
        run: |
          site_db=$(find sites/test_site/db -maxdepth 1 -type f -name '*.db' -print -quit)
          if [ -z "$site_db" ]; then
            echo "SQLite database file was not found"
            exit 1
          fi

          python - "$site_db" "$RUNNER_TEMP/pristine.db" <<'PY'
          import sqlite3
          import sys

          with sqlite3.connect(sys.argv[1]) as source, sqlite3.connect(sys.argv[2]) as target:
              source.backup(target)
          PY

          cp -a sites/test_site "$RUNNER_TEMP/pristine-site"
          cp "$RUNNER_TEMP/pristine.db" "$RUNNER_TEMP/pristine-site/db/$(basename "$site_db")"
          rm -f "$RUNNER_TEMP/pristine-site/db/$(basename "$site_db")-wal"
          rm -f "$RUNNER_TEMP/pristine-site/db/$(basename "$site_db")-shm"
      - name: Add a site for every extra worker
        shell: bash
        # A SQLite site is a folder, so a worker's site is a copy of the saved one with its own
        # database name, host name and cache server. The workers then share no data. A cache
        # database on the shared server is not enough: flushing it empties the in-process cache
        # of every client of that server.
        run: |
          for worker in $(seq 2 "$WORKERS"); do
            cache_port=$((13100 + worker))
            redis-server --port "$cache_port" --daemonize yes --save "" --appendonly no
            site="test_site_$worker"
            echo "127.0.0.1 $site" | sudo tee -a /etc/hosts
            cp -a "$RUNNER_TEMP/pristine-site" "$RUNNER_TEMP/pristine-site-$worker"
            cd "$RUNNER_TEMP/pristine-site-$worker"
            db_name=$(jq -r .db_name site_config.json)
            mv "db/$db_name.db" "db/${db_name}_$worker.db"
            jq --arg db "${db_name}_$worker" --arg host "http://$site:8000" \
              --arg cache "redis://127.0.0.1:$cache_port" \
              '. + {db_name: $db, host_name: $host, redis_cache: $cache}' site_config.json > site_config.json.new
            mv site_config.json.new site_config.json
            cd - > /dev/null
          done
      - name: Run Tests
        shell: bash
        run: |
          echo "$ALL_TESTS" | jq -r --argjson shard "$SHARD_INDEX" --argjson total "$SHARD_COUNT" \
            '[to_entries[] | select(.key % $total == ($shard - 1)) | .value] | .[]' > shard_tests.txt

          run_worker() {
            local worker=$1 site=test_site pristine="$RUNNER_TEMP/pristine-site" status=0
            if [ "$worker" -gt 1 ]; then
              site="test_site_$worker"
              pristine="$RUNNER_TEMP/pristine-site-$worker"
            fi
            local cache_url
            cache_url=$(jq -r .redis_cache "$pristine/site_config.json" sites/common_site_config.json | grep -v null | head -1)

            while IFS= read -r test; do
              # MariaDB's individual-test workflow gives every module a fresh site. Restore the
              # SQLite site too, so committed database rows and files cannot leak between modules.
              rsync --archive --delete "$pristine/" "sites/$site/"
              redis-cli -u "$cache_url" flushdb > /dev/null

              echo "Running $test"
              bench --site "$site" run-tests --app frappe --module "$test" || status=1
            done < <(awk -v workers="$WORKERS" -v worker="$worker" 'NR % workers == worker - 1' shard_tests.txt)
            return "$status"
          }

          pids=()
          for worker in $(seq 1 "$WORKERS"); do
            run_worker "$worker" &> "worker-$worker.log" &
            pids+=($!)
          done

          status=0
          for worker in $(seq 1 "$WORKERS"); do
            wait "${pids[$((worker - 1))]}" || status=1
            echo "::group::Worker $worker"
            cat "worker-$worker.log"
            echo "::endgroup::"
          done
          exit "$status"

  http-integration:
    needs: checkrun
    if: ${{ needs.checkrun.outputs.build == 'strawberry' || contains(github.event.pull_request.labels.*.name, 'sqlite') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Run the HTTP contract separately with required service(s)
    env:
      NODE_ENV: production
    name: SQLite HTTP integration
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: "3.14"
          node-version: 24
          db: sqlite
          prebuilt-assets: true
          db-root-password: db_root
          disable-socketio: true
          disable-workers: true
          enable-server-scripts: true
      - name: Wait for web server
        shell: bash
        run: |
          if ! curl --fail --silent --show-error \
            --retry 30 --retry-delay 1 --retry-connrefused \
            http://test_site:8000/api/method/ping > /dev/null; then
            echo "Frappe web server did not become ready"
            cat "$GITHUB_WORKSPACE/bench_start.log"
            exit 1
          fi
      - name: Run HTTP-dependent SQLite tests
        shell: bash
        run: |
          bench --site test_site run-tests --app frappe --test-service web-server
