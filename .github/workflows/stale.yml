name: "Close Stale PRs"
on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          days-before-pr-stale: 15
          days-before-pr-close: 1
          days-before-issue-stale: -1
          days-before-issue-close: -1
          stale-pr-label: 'inactive'
          exempt-pr-labels: 'hotfix,no-stale'
          exempt-all-pr-milestones: true
          remove-pr-stale-when-updated: true
          operations-per-run: 100
          stale-pr-message: >
            This pull request has been automatically marked as stale because it has not had
            recent activity. It will be closed within 1 day if no further activity occurs, but it
            only takes a comment to keep a contribution alive :) Also, even if it is closed,
            you can always reopen the PR when you're ready. Thank you for contributing.
      - uses: actions/github-script@v8
        with:
          script: |
            const cutoff = Date.now() - 10 * 24 * 60 * 60 * 1000;
            const prs = await github.paginate(github.rest.pulls.list, {
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            for (const pr of prs) {
              if (pr.user.login !== "mergify[bot]") continue;
              if (pr.labels.some((l) => l.name === "no-stale")) continue;
              if (new Date(pr.updated_at).getTime() > cutoff) continue;
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: pr.number,
                body: "This backport had no activity for 10 days, so it is being closed. Reopen it when you are ready to fix the conflicts.",
              });
              await github.rest.pulls.update({
                ...context.repo,
                pull_number: pr.number,
                state: "closed",
              });
            }
