name: UI Base
on:
  workflow_call:
    inputs:
      fake-success:
        required: false
        type: boolean
        default: false
      python-version:
        required: false
        type: string
        default: '3.14'
      node-version:
        required: false
        type: number
        default: 24
      parallel-runs:
        required: false
        type: number
        default: 2
      enable-coverage:
        required: false
        type: boolean
        default: false


jobs:
  gen-idx-integration:
    name: Gen Integration Test Matrix
    runs-on: ubuntu-latest
    if: ${{ inputs.fake-success == false }}
    outputs:
      indices: ${{ steps.set-indices.outputs.indices }}
    steps:
      - id: set-indices
        run: |
          indices=$(seq -s ',' 1 ${{ inputs.parallel-runs }}); echo "indices=[${indices}]" >> $GITHUB_OUTPUT

  ui-test:
    needs: gen-idx-integration
    name: Integration
    runs-on: ubuntu-latest
    if: ${{ inputs.fake-success == false }}
    timeout-minutes: 30
    env:
      NODE_ENV: "production"
      # noisy 3rd party library warnings
      PYTHONWARNINGS: "ignore"
      DB_ROOT_PASSWORD: db_root

    strategy:
      fail-fast: false
      matrix:
        db: ["mariadb"]
        index: ${{ fromJson(needs.gen-idx-integration.outputs.indices) }}
    services:
      mariadb:
        image: mariadb:11.8
        ports:
          - 3306:3306
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval=5s --health-timeout=2s --health-retries=3
        env:
          MARIADB_ROOT_PASSWORD: ${{ env.DB_ROOT_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
        name: Environment Setup
        with:
          python-version: ${{ inputs.python-version }}
          node-version: ${{ inputs.node-version }}
          build-assets: true
          enable-coverage: ${{ inputs.enable-coverage }}
          db-root-password: ${{ env.DB_ROOT_PASSWORD }}
          db: ${{ matrix.db }}

      - name: Verify yarn.lock
        run: |
          cd ${GITHUB_WORKSPACE}/apps/${{ github.event.repository.name }}
          git diff --exit-code yarn.lock

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('frappe/commands/testing.py') }}

      - name: Site Setup
        run: |
          # a second site, so the shard can run two workers without sharing data
          echo "127.0.0.1 test_site_2" | sudo tee -a /etc/hosts
          bench new-site test_site_2 \
            --db-type ${{ matrix.db }} \
            --db-host 127.0.0.1 \
            --db-name test_frappe_2 \
            --db-password test_frappe
          jq -s '.[1] + .[0] + {host_name: "http://test_site_2:8000"}' \
            sites/test_site_2/site_config.json sites/test_site/site_config.json > site_config.json
          mv site_config.json sites/test_site_2/site_config.json

          for site in test_site test_site_2; do
            bench --site $site execute frappe.utils.install.complete_setup_wizard
            bench --site $site execute frappe.tests.ui_test_helpers.create_test_user
          done

      - name: Run Tests
        id: ui-tests
        run: |
          bench --site test_site \
            run-ui-tests ${{ github.event.repository.name }} \
              --headless \
              --parallel-site test_site_2 \
              --shard=${{ matrix.index }}/${{ inputs.parallel-runs }}

      - name: Stop server and wait for coverage file
        if: inputs.enable-coverage
        run: |
          ps -ef | grep "[f]rappe serve" | awk '{print $2}' | xargs kill -s SIGINT
          sleep 5
          ( tail -f ${GITHUB_WORKSPACE}/sites/*-coverage*.xml & ) | grep -q "\/coverage"

      - name: Upload Playwright Report
        if: always() && steps.ui-tests.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.index }}
          path: |
            apps/${{ github.event.repository.name }}/playwright-report
            apps/${{ github.event.repository.name }}/test-results

      - name: Upload coverage data
        uses: actions/upload-artifact@v6
        if: inputs.enable-coverage
        with:
          name: coverage-py-${{ matrix.index }}
          path: ./sites/*-coverage*.xml

      - name: Setup tmate session
        uses: mxschmitt/action-tmate@v3
        if: ${{ failure() && contains( github.event.pull_request.labels.*.name, 'debug-gha') }}

      - name: Show bench output
        if: ${{ always() }}
        run: |
          cat bench_start.log || true
          cd logs
          for f in ${GITHUB_WORKSPACE}/*.log*; do
            echo "Printing log: $f";
            cat $f
          done

  # TIP: Use these for checks, e.g. UI / Tests (Cypress) / Success
  success:
    name: Success
    needs: [ui-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: UI Test '${{ needs.ui-test.result }}'
        shell: python
        run: |
          stati = [
            '${{ needs.ui-test.result }}',
          ]

          nopass = ["failure", "cancelled"]
          dopass = ["success", "skipped"]
          if any(r in nopass for r in stati):
            exit(1)
          if all(r in dopass for r in stati):
            exit(0)
          exit(1)
