name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "ui/**"
      # The structure check also checks frappe/shell/. A use of it from the rest of frappe/ is
      # checked by frappe/tests/test_desk_server_layer.py in the server tests, not here.
      - "frappe/shell/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-frontend-${{ hashFiles('frontend/yarn.lock.base') }}
          restore-keys: |
            ${{ runner.os }}-yarn-frontend-

      # Both are generated by `bench build` and gitignored; the committed base pair was
      # resolved with no app declared, which is what `--frozen-lockfile` below checks.
      - name: Compose package.json and yarn.lock from the committed base
        run: |
          cp frontend/package.base.json frontend/package.json
          cp frontend/yarn.lock.base frontend/yarn.lock

      - name: Install
        run: yarn --cwd frontend install --frozen-lockfile

      # The API v2 check: no v1 address and no frappe-ui fetch primitive in the desk.
      - name: Lint
        run: yarn --cwd frontend lint

      - name: Check that every test file runs
        run: yarn --cwd frontend test:files

      - name: Run unit tests
        run: yarn --cwd frontend test:run

      # Layers, folder loops and concepts against the baselines in frontend/architecture/layers.json.
      # It also prints the files each flow reaches, and never fails on those.
      - name: Check the desk structure
        if: ${{ !cancelled() }}
        run: node frontend/architecture/diagram.mjs --flows --out desk-architecture.html

      - name: Upload the architecture page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desk-architecture
          path: desk-architecture.html
          if-no-files-found: ignore
