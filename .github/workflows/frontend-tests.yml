name: Frontend

on:
  # desk-v2 runs it too, so two PRs that each stay inside the page-JS tolerance cannot add up unseen.
  push:
    branches: [desk-v2]
  pull_request:
    paths:
      - "frontend/**"
      - "ui/**"
      # The structure check also checks frappe/shell/. A use of it from the rest of frappe/ is
      # checked by frappe/tests/test_desk_server_layer.py in the server tests, not here.
      - "frappe/shell/**"
      # Contributed pages, records and settings are part of the build the page-JS check measures.
      - "frappe/**/frontend/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.14"
          activate-environment: true
          venv-path: ${{ runner.temp }}/venv
          cache-dependency-glob: pyproject.toml

      - id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-frontend-${{ hashFiles('frontend/yarn.lock.base') }}
          restore-keys: |
            ${{ runner.os }}-yarn-frontend-

      # Both are generated by `bench build` and gitignored; the committed base pair was
      # resolved with no app declared, which is what `--frozen-lockfile` below checks.
      - name: Compose package.json and yarn.lock from the committed base
        run: |
          cp frontend/package.base.json frontend/package.json
          cp frontend/yarn.lock.base frontend/yarn.lock

      - name: Install
        run: yarn --cwd frontend install --frozen-lockfile

      # The API v2 check: no v1 address and no frappe-ui fetch primitive in the desk.
      - name: Lint
        run: yarn --cwd frontend lint

      - name: Type check
        if: ${{ !cancelled() }}
        run: yarn --cwd frontend typecheck

      - name: Check that every test file runs
        run: yarn --cwd frontend test:files

      - name: Run unit tests
        run: yarn --cwd frontend test:run

      # Layers, folder loops and concepts against the baselines in frontend/architecture/layers.json.
      # It also prints the files each flow reaches, and never fails on those.
      - name: Check the desk structure
        if: ${{ !cancelled() }}
        run: node frontend/architecture/diagram.mjs --flows --out desk-architecture.html

      # mysqlclient needs system libraries, and writing the manifest does not import it.
      - name: Write the build manifest
        if: ${{ !cancelled() }}
        run: |
          python -c 'import tomllib; print("\n".join(d for d in tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"] if not d.startswith("mysqlclient")))' > "$RUNNER_TEMP/requirements.txt"
          uv pip install --quiet -r "$RUNNER_TEMP/requirements.txt"
          mkdir "$RUNNER_TEMP/sites"
          echo frappe > "$RUNNER_TEMP/sites/apps.txt"
          python -c 'import frappe; frappe.init("", sites_path="'"$RUNNER_TEMP/sites"'"); from frappe.shell.manifest import write; write()'

      - name: Check the JS each desk page loads
        if: ${{ !cancelled() }}
        run: yarn --cwd frontend test:page-js

      - name: Upload the architecture page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: desk-architecture
          path: desk-architecture.html
          if-no-files-found: ignore
