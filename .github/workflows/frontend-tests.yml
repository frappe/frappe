name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "ui/**"
      - ".github/workflows/frontend-tests.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v6
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-frontend-${{ hashFiles('frontend/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-frontend-

      # `frontend/package.json` is generated by `frappe/shell/manifest.py` during
      # `bench build` and is gitignored, so it does not exist in a clone. Composing it
      # properly needs a site to know which apps are installed -- but the committed
      # `yarn.lock` was resolved from `package.base.json` alone, and the tests need
      # nothing an app contributes, so the base IS the right input here. That is also
      # what makes `--frozen-lockfile` below a real check rather than a formality.
      - name: Compose package.json from the committed base
        run: cp frontend/package.base.json frontend/package.json

      - name: Install
        run: yarn --cwd frontend install --frozen-lockfile

      - name: Run unit tests
        run: yarn --cwd frontend test:run
