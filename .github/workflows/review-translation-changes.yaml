name: Review translation PRs

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "**/*.po"
      - "**/*.pot"

concurrency:
  group: po-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-po-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/checkout@v7
        with:
          repository: alyf-de/po-review-action
          ref: f40006d8450de7fd5b538e38603185bbee744117 # v1.3.0
          path: .po-review-action
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build translation review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HIDDEN_PO_FILES: eo.po
          REVIEW_JSON: ${{ runner.temp }}/po-pr-review-comments.json
          REVIEW_MD: ${{ runner.temp }}/translation-review.md
        run: |
          python -m pip install --disable-pip-version-check ./.po-review-action
          python .po-review-action/po_pr_review.py \
            --repo "$GITHUB_REPOSITORY" \
            --pr "$PR_NUMBER" \
            --head-sha "$PR_HEAD_SHA" \
            --output "$REVIEW_JSON"
          jq -r '(.comments + .pot_comments) | join("\n\n")' "$REVIEW_JSON" > "$REVIEW_MD"

      - name: Upload full review
        id: upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/translation-review.md
          archive: false
          retention-days: 30

      - name: Post summary comment
        uses: actions/github-script@v8
        env:
          REVIEW_JSON: ${{ runner.temp }}/po-pr-review-comments.json
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- po-translation-review -->";
            const payload = JSON.parse(fs.readFileSync(process.env.REVIEW_JSON, "utf8"));
            const poBodies = payload.comments || [];
            const potBodies = payload.pot_comments || [];

            const count = (bodies, pattern) => {
              const counts = new Map();
              for (const body of bodies) {
                for (const m of body.matchAll(pattern)) {
                  const prev = counts.get(m[1]) || m.slice(2).map(() => 0);
                  counts.set(m[1], prev.map((v, i) => v + Number(m[i + 2])));
                }
              }
              return counts;
            };

            const lines = [marker];
            if (poBodies.length) {
              lines.push(poBodies[0].split("\n<details>")[0].replace(marker, "").trim(), "");
              const langs = count(poBodies, /<summary>(.+?) (?:—|\(part \d+ of \d+,) (\d+) entries\)?<\/summary>/g);
              if (langs.size) {
                lines.push("### Entries per language", "", "| Language | Entries |", "| --- | --- |");
                for (const [lang, [n]] of langs) lines.push(`| ${lang} | ${n} |`);
                lines.push("");
              }
              const last = poBodies[poBodies.length - 1];
              const tail = last.slice(last.lastIndexOf("</details>") + "</details>".length).trim();
              if (tail.startsWith("###")) lines.push(tail, "");
            }
            if (potBodies.length) {
              const head = potBodies[0].split("\n<details>")[0].replace("<!-- pot-template-review -->", "").trim();
              lines.push(head || "Here is a summary of the `.pot` file changes:", "");
              const files = count(potBodies, /<summary>(.+?) (?:—|\(part \d+ of \d+,) (\d+) added, (\d+) removed, (\d+) corrected\)?<\/summary>/g);
              if (files.size) {
                lines.push("| File | Added | Removed | Corrected |", "| --- | --- | --- | --- |");
                for (const [file, [a, r, c]] of files) lines.push(`| ${file} | ${a} | ${r} | ${c} |`);
                lines.push("");
              }
              const last = potBodies[potBodies.length - 1];
              const tail = last.slice(last.lastIndexOf("</details>") + "</details>".length).trim();
              if (tail.startsWith("###")) lines.push(tail, "");
            }
            lines.push(`Full per-file changes: [translation-review.md](${process.env.ARTIFACT_URL}) (workflow artifact).`);
            const body = lines.join("\n").slice(0, 60000);

            await core.summary.addRaw(body.replace(marker, "")).write();

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const existing = (
              await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 })
            ).filter(
              (c) =>
                c.user?.login === "github-actions[bot]" &&
                (c.body?.startsWith("<!-- po-translation-review") || c.body?.startsWith("<!-- pot-template-review"))
            );
            const keep = existing.find((c) => c.body.startsWith(marker));
            if (keep) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: keep.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
            for (const c of existing) {
              if (c.id !== keep?.id) await github.rest.issues.deleteComment({ owner, repo, comment_id: c.id });
            }

            if (payload.error_count) {
              core.setFailed(`${payload.error_count} translation file(s) could not be parsed or compiled. See the PR comment for details.`);
            }
