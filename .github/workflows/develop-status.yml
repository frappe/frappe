name: Develop Status

# Every setting for the develop status check lives in this file.
on:
  schedule:
    # How often the full server and UI suites run on develop (skipped when develop has no new commits).
    - cron: "23 */2 * * *"
  workflow_run:
    workflows: ["Server", "UI"]
    types: [completed]
    branches: [develop]
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
  workflow_dispatch:

env:
  # The required check posted on every develop pull request.
  STATUS_CONTEXT: "Develop status"
  # A pull request with this label can merge while develop is failing.
  FIX_LABEL: "fixes-develop"
  # The jobs whose result decides whether develop is passing.
  SERVER_GATE_JOB: "Server Success"
  UI_GATE_JOB: "UI Success"
  # How many times a failed develop run is retried before develop counts as failing.
  RETRIES: 1

permissions:
  contents: read
  actions: write
  statuses: write
  pull-requests: read

jobs:
  run-suites:
    name: Run Full Suites
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the suites on new develop commits
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
          for workflow in server-tests.yml ui-tests.yml; do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=develop&per_page=30" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha')
            if [ "$last" = "$head" ]; then
              echo "$workflow already ran on $head"
            else
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref develop
            fi
          done
        env:
          GH_TOKEN: ${{ github.token }}

  update:
    name: Update Pull Requests
    if: >-
      ${{ github.event_name != 'workflow_run'
      || contains(fromJson('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) }}
    runs-on: ubuntu-latest
    concurrency:
      group: develop-status-${{ github.event.pull_request.number || 'all' }}
      cancel-in-progress: true
    steps:
      - name: Retry a failed develop run
        id: retry
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure' }}
        run: |
          if [ "$ATTEMPT" -le "$RETRIES" ]; then
            gh run rerun "$RUN_ID" --failed --repo "$GITHUB_REPOSITORY"
            echo "retried=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}

      - uses: actions/checkout@v7
        if: ${{ steps.retry.outputs.retried != 'true' }}
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/helper

      - name: Post develop status
        if: ${{ steps.retry.outputs.retried != 'true' }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            python .github/helper/develop_status.py pr "$PR_NUMBER"
          else
            python .github/helper/develop_status.py refresh
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
