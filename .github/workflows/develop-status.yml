name: Develop Status

on:
  schedule:
    # How often the full server and UI suites run on develop, when develop has new commits.
    - cron: "23 * * * *"
  workflow_run:
    workflows: ["Server", "UI"]
    types: [completed]
    branches: [develop]
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write
  pull-requests: read

jobs:
  run-suites:
    name: Run Full Suites
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Start the suites on develop
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)
          for workflow in server-tests.yml ui-tests.yml; do
            last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=develop" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha')
            if [ "$EVENT" = "workflow_dispatch" ] || [ "$last" != "$head" ]; then
              gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref develop
            fi
          done
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}

  update:
    name: Update Pull Requests
    if: ${{ github.event_name != 'workflow_run' || contains(fromJson('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) }}
    runs-on: ubuntu-latest
    concurrency:
      group: develop-status-${{ github.event.pull_request.number || 'all' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/helper
      - name: Restart the suites when a full CI label is added
        if: ${{ github.event.action == 'labeled' }}
        run: |
          labels=$(python -c "import sys; sys.path.insert(0, '.github/helper'); import roulette; print(roulette.FULL_CI_LABEL, roulette.FIX_DEVELOP_LABEL)")
          case " $labels " in *" $LABEL "*) ;; *) exit 0 ;; esac
          for workflow in server-tests.yml ui-tests.yml; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$run_id" ] || continue
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" 2>/dev/null && gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" > /dev/null || true
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL: ${{ github.event.label.name }}
      - run: python .github/helper/develop_status.py ${{ github.event.pull_request.number && format('pr {0}', github.event.pull_request.number) || 'refresh' }}
        env:
          GH_TOKEN: ${{ github.token }}
