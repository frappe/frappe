name: Develop Tests

on:
  schedule:
    # How often the full server and UI suites run on develop, when develop has new commits.
    - cron: "23 * * * *"
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  workflow_run:
    workflows: [Server, UI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write
  pull-requests: read

jobs:
  run-suites:
    name: Run Full Suites
    if: >-
      ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      || (github.event.action == 'closed' && github.event.pull_request.merged
      && contains(github.event.pull_request.labels.*.name, 'fixes-develop')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/helper
      - run: python .github/helper/develop_status.py start ${{ github.event_name != 'schedule' && 'all' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Turn pull requests green once the fix lands
        if: ${{ github.event.action == 'closed' }}
        run: python .github/helper/develop_status.py refresh
        env:
          GH_TOKEN: ${{ github.token }}

  update:
    name: Update Pull Requests
    if: >-
      ${{ github.event.action != 'closed'
      && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
      && (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action)
      || contains(fromJSON('["fixes-develop", "run-full-ci"]'), github.event.label.name)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    concurrency:
      group: develop-status-${{ github.event.pull_request.number || github.event.workflow_run.head_sha || 'all' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/helper
      - name: Restart the suites when a full CI label is added
        if: ${{ github.event.action == 'labeled' }}
        run: |
          for workflow in server-tests.yml ui-tests.yml; do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --commit "$HEAD_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
            [ -n "$run_id" ] || continue
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
            for _ in $(seq 360); do [ "$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)" = completed ] && break; sleep 10; done
            gh run rerun "$run_id" --repo "$GITHUB_REPOSITORY"
          done
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - run: |
          if [ "$ACTION" = labeled ]; then python .github/helper/develop_status.py wait "$PR"
          elif [ -n "$PR" ]; then python .github/helper/develop_status.py pr "$PR"
          elif [ -n "$RUN_SHA" ]; then python .github/helper/develop_status.py commit "$RUN_SHA"
          else python .github/helper/develop_status.py refresh
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          PR: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
