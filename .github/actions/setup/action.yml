name: 'Setup Environment'
description: 'Sets up the environment for Frappe development'
inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.14'
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '24'
  build-assets:
    required: false
    description: 'Whether to build assets'
    default: true
  prebuilt-assets:
    required: false
    description: 'Download the assets built for the base commit instead of building, when the pull request changes no frontend file'
    default: false
  enable-coverage:
    required: false
    default: false
  disable-web:
    required: false
    default: false
  disable-socketio:
    required: false
    default: false
  disable-workers:
    required: false
    description: 'Whether to disable background workers'
    default: false
  enable-server-scripts:
    required: false
    description: 'Whether to enable Server Scripts for tests that call them through the web server'
    default: true
  db:
    required: false
    default: mariadb
  db-root-password:
    required: true

runs:
  using: "composite"
  steps:
  - shell: bash -e {0}
    run: |
      # Add 'test_site' to /etc/hosts & setup git config
      echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts
      git config --global init.defaultBranch main
      git config --global advice.detachedHead false

  - name: Clone
    uses: actions/checkout@v6
    with:
      path: frappe-src

  - name: Setup Python
    uses: actions/setup-python@v6
    with:
      python-version: ${{ inputs.python-version }}

  - shell: bash -e {0}
    run: |
      # Check for valid Python & Merge Conflicts
      python -m compileall -q -f "${GITHUB_WORKSPACE}/frappe-src"
      if grep -lr --exclude-dir=node_modules "^<<<<<<< " "${GITHUB_WORKSPACE}/frappe-src"
          then echo "Found merge conflicts"
          exit 1
      fi

  - uses: actions/setup-node@v6
    with:
      node-version: ${{ inputs.node-version }}
      check-latest: true

  - uses: astral-sh/setup-uv@v6

  - name: Cache pip
    uses: actions/cache@v4
    with:
      path: ~/.cache/pip
      key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py') }}
      restore-keys: |
        ${{ runner.os }}-pip-
        ${{ runner.os }}-

  - id: yarn-cache-dir-path
    shell: bash -e {0}
    run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT
  - uses: actions/cache/restore@v4
    id: yarn-cache
    with:
      path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
      key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
      restore-keys: |
        ${{ runner.os }}-yarn-
        node-cache-${{ runner.os }}-x64-yarn-

  - shell: bash -e {0}
    run: |
      # Add the PostgreSQL apt repository
      sudo install -d /usr/share/postgresql-common/pgdg
      sudo curl -fsSL --retry 3 --retry-all-errors -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
      echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
      sudo apt-get -qq update \
        -o Dir::Etc::sourcelist=/etc/apt/sources.list.d/pgdg.list \
        -o Dir::Etc::sourceparts=- \
        -o APT::Get::List-Cleanup=0

  - name: Install System Dependencies
    uses: awalsh128/cache-apt-pkgs-action@v1.6.3
    with:
      packages: libcups2-dev redis-server mariadb-client libmariadb-dev postgresql-client-18 libpq-dev fontconfig libjpeg-turbo8 xfonts-75dpi xfonts-base

  - shell: bash -e {0}
    run: |
      # Install wkhtmltopdf
      echo "/usr/lib/postgresql/18/bin" >> $GITHUB_PATH
      curl -fsSL --retry 3 --retry-all-errors -o /tmp/wkhtmltox.deb https://github.com/wkhtmltopdf/packaging/releases/download/0.12.6.1-2/wkhtmltox_0.12.6.1-2.jammy_amd64.deb
      sudo apt-get -qq install -y --no-install-recommends /tmp/wkhtmltox.deb

  - shell: bash -e {0}
    run: |
      # Init Bench
      start_time=$(date +%s)
      uv tool install frappe-bench
      bench init ${GITHUB_WORKSPACE} \
        --ignore-exist \
        --frappe-path "${GITHUB_WORKSPACE}/frappe-src" \
        --skip-assets \
        --no-backups \
        --python "$(which python)"

      # bench init sets origin to the local checkout path, fix it to point at GitHub
      git -C apps/frappe remote set-url upstream "https://github.com/${{ github.repository }}"

      # Trim Procfile for CI
      sed -i '/^watch:/d' Procfile
      sed -i '/^schedule:/d' Procfile
      if [ "${{ inputs.disable-web }}" == "true" ]; then
        sed -i '/^web:/d' Procfile
      elif [ "${{ inputs.enable-coverage }}" == "true" ]; then
        sed -i 's|^web: bench serve|web: bench serve --with-coverage|' Procfile
      fi
      if [ "${{ inputs.disable-socketio }}" == "true" ]; then
        sed -i '/^socketio:/d' Procfile
      fi
      if [ "${{ inputs.disable-workers }}" == "true" ]; then
        sed -i '/^worker[^:]*:/d' Procfile
      fi

      # Tests declare the services they need with requires_test_service(). Derive those flags from the same inputs that trim the Procfile, so a job cannot  start a service it tells the tests is absent (or the reverse).
      if [ "${{ inputs.disable-web }}" == "true" ]; then
        echo "FRAPPE_TEST_WEB_SERVER=0" >> "$GITHUB_ENV"
      else
        echo "FRAPPE_TEST_WEB_SERVER=1" >> "$GITHUB_ENV"
      fi
      if [ "${{ inputs.disable-workers }}" == "true" ]; then
        echo "FRAPPE_TEST_BACKGROUND_WORKER=0" >> "$GITHUB_ENV"
      else
        echo "FRAPPE_TEST_BACKGROUND_WORKER=1" >> "$GITHUB_ENV"
      fi

      end_time=$(date +%s)
      echo -e "\033[33mInit Bench: $((end_time - start_time)) seconds\033[0m"

  - shell: bash -e {0}
    run: |
      # Install dev/test dependencies
      start_time=$(date +%s)
      bench setup requirements --dev
      if [ "${{ inputs.build-assets }}" == "true" ]; then
        bench setup requirements --node
      fi

      end_time=$(date +%s)
      echo -e "\033[33mInstall dev/test deps: $((end_time - start_time)) seconds\033[0m"

  - shell: bash -e {0}
    env:
      DB: ${{ inputs.db }}
