<!doctype html>
<html class="h-full" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>{{ app_title }}</title>
  </head>
  <body class="h-full">
    <div id="app" class="h-full"></div>
    {% raw %}{%- for key in boot %}
    <script>
      window["{{ key }}"] = {{ boot[key] | tojson }};
    </script>
    {%- endfor %}{% endraw %}
  </body>
</html>
