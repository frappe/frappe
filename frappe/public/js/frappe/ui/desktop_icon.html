<a href="#" class="desktop-icon" style="text-decoration:none">
    {% if (icon.logo_url) { %}
        <div class="icon-container">
            <img class="app-icon" src="{{ icon.logo_url }}" alt="{{ icon.label }}" />
        </div>
    {% } else { %}
        {%= frappe.utils.desktop_icon(icon.label, "gray", "md", "Solid") %}
    {% } %}
    <div class="icon-caption">
        <div class="icon-title" data-toggle="tooltip" data-original-title="{{ __(icon.label) }}">{{ __(icon.label) }}</div>
    </div>
</a>
