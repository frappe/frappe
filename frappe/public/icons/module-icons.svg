<!-- Dual-tone module icons for the desk dock and sidebar headers.

     This sprite is inserted into the page, so the style block below is a document stylesheet: it can
     style the tiles that hold an icon as well as the shapes inside one. -->

<svg id="frappe-module-symbols" aria-hidden="true" style="display: none;" class="icon" xmlns="http://www.w3.org/2000/svg">
	<style>
		/* Tones. A symbol fills from --duotone-light and --duotone-dark. Only custom properties reach
		   inside a use element, so the surface holding the icon sets them, and a symbol's own
		   fallbacks are the resting tones it wears anywhere else.

		   Hover is motion alone: a hovered dock tile keeps the resting tones. The active tile moves
		   both tones one ink token on. The sidebar header never animates and its hover changes
		   nothing, except in the dark theme, where its hover fill would swallow the resting light
		   tone, so there the light tone moves one token on.

		   The ink scale is not the same shape in both themes, so where one token name does not land
		   on the right grey in each, light-dark() picks a token per theme.
		     rest           light: ink-gray-3 / ink-gray-5     dark: ink-gray-3 / ink-gray-6
		     dock hover     as rest
		     header hover   light: as rest                     dark: ink-gray-4 / ink-gray-6
		     active         light: ink-gray-4 / ink-gray-6     dark: ink-gray-4 / ink-gray-7 */
		.shell-header:hover .header-logo,
		.shell-header.hover .header-logo {
			--duotone-light: light-dark(var(--ink-gray-3), var(--ink-gray-4));
		}
		.dock-item--duotone.active {
			--duotone-light: var(--ink-gray-4);
			--duotone-dark: light-dark(var(--ink-gray-6), var(--ink-gray-7));
		}
		/* Build: three lines of code turn into an app while the dock tile is hovered. The first line
		   becomes a sidebar and the other two become cards. A rectangle's x, y, width and height are
		   CSS properties, so each one is a calc between its line and its piece of the app, steered
		   by the icon-motion property the tile sets (see dock.scss). Leaving the tile runs the same
		   transitions back from wherever they are. */
		@media (prefers-reduced-motion: no-preference) {
			.code-app-line {
				transition: x 0.42s, y 0.42s, width 0.42s, height 0.42s;
				transition-timing-function: cubic-bezier(0.34, 1.25, 0.64, 1);
			}
			.code-app-line-1 {
				width: calc(7px + var(--icon-motion-opacity, 0) * -2.8px);
				height: calc(1.9px + var(--icon-motion-opacity, 0) * 6.2px);
			}
			.code-app-line-2 {
				x: calc(7px + var(--icon-motion-opacity, 0) * 2.6px);
				y: calc(12.85px + var(--icon-motion-opacity, 0) * -3.1px);
				width: calc(10.5px + var(--icon-motion-opacity, 0) * -0.1px);
				height: calc(1.9px + var(--icon-motion-opacity, 0) * 1.4px);
				transition-delay: 0.07s;
			}
			.code-app-line-3 {
				x: calc(7px + var(--icon-motion-opacity, 0) * 2.6px);
				y: calc(15.95px + var(--icon-motion-opacity, 0) * -1.5px);
				width: calc(6px + var(--icon-motion-opacity, 0) * 4.4px);
				height: calc(1.9px + var(--icon-motion-opacity, 0) * 1.5px);
				transition-delay: 0.14s;
			}
		}
		/* Users: the two people behind step out from behind the one in front while the dock tile is
		   hovered, and step back when the pointer leaves. A person behind is drawn twice: the part
		   that shows at rest, and the fuller body that shows once they have stepped out. The fuller
		   one stays hidden until they move, or it would fill the gap beside the person in front. */
		.users-side-whole {
			opacity: 0;
		}
		@media (prefers-reduced-motion: no-preference) {
			.users-side {
				transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
			}
			.users-side-left {
				transform: translateX(calc(var(--icon-motion-opacity, 0) * -2.8px));
			}
			.users-side-right {
				transform: translateX(calc(var(--icon-motion-opacity, 0) * 2.8px));
				transition-delay: 0.06s;
			}
			.users-side-whole {
				opacity: var(--icon-motion-opacity, 0);
				transition: opacity 0.15s;
				transition-delay: calc(var(--icon-motion-opacity, 0) * 0.1s);
			}
		}
		/* System: the heart line keeps flowing across the screen while the dock tile is hovered, the way
		   a monitor's trace does, and stops where it is when the pointer leaves. The trace repeats every
		   13 units, so one period of travel loops seamlessly. A nested svg clips it to the display. */
		@media (prefers-reduced-motion: no-preference) {
			.system-trace {
				animation: system-trace 1.3s linear infinite;
				animation-play-state: var(--icon-motion, paused);
			}
		}
		@keyframes system-trace {
			to {
				transform: translateX(-13px);
			}
		}
	</style>
	<!-- The window rests on y 19.75, not the bottom of the grid, which sits it on a 14px label's
	     descender line in the 28px sidebar mark and lifts the dark wall toward the centre of a dock tile. -->
	<symbol viewBox="0 0 24 24" id="icon-code-app-duotone" stroke="none">
		<path fill-rule="evenodd" d="M2 7.15V4.75A1.8 1.8 0 0 1 3.8 2.95H20.2A1.8 1.8 0 0 1 22 4.75V7.15Z M4.05 5.05a.85.85 0 1 0 1.7 0a.85.85 0 1 0-1.7 0Z M6.85 5.05a.85.85 0 1 0 1.7 0a.85.85 0 1 0-1.7 0Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<path d="M2 7.85H22V17.95A1.8 1.8 0 0 1 20.2 19.75H3.8A1.8 1.8 0 0 1 2 17.95Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<rect class="code-app-line code-app-line-1" x="4" y="9.75" width="7" height="1.9" rx="0.95" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect class="code-app-line code-app-line-2" x="7" y="12.85" width="10.5" height="1.9" rx="0.95" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<rect class="code-app-line code-app-line-3" x="7" y="15.95" width="6" height="1.9" rx="0.95" style="fill: var(--duotone-light, var(--ink-gray-3))" />
	</symbol>
	<!-- One person in front and two behind, standing on the same y 19.75 as the Build window. The seam
	     between the tones is a real gap, 0.7 wide, cut out of the two behind: the active dock tile is
	     translucent, so a seam painted in the page colour would show as an outline. Each users-side-whole
	     path is the same body cut for where it stands after stepping out 2.8. -->
	<symbol viewBox="0 0 24 24" id="icon-users-duotone" stroke="none" style="overflow: visible">
		<g class="users-side users-side-left">
			<path class="users-side-whole" d="M.95 18.85V15.85A3.4 3.4 0 0 1 4.35 12.45H5.55A3.4 3.4 0 0 1 8.21 13.73A5.5 5.5 0 0 0 7.8 15.8V18.85A1.6 1.6 0 0 0 8.08 19.75H1.85A.9.9 0 0 1 .95 18.85Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<path d="M2.3 8.95a2.65 2.65 0 1 0 5.3 0a2.65 2.65 0 1 0-5.3 0Z M.95 18.85V15.85A3.4 3.4 0 0 1 4.35 12.45H5.55A3.4 3.4 0 0 1 6.1 12.5A5.5 5.5 0 0 0 5 15.8V18.85A1.6 1.6 0 0 0 5.28 19.75H1.85A.9.9 0 0 1 .95 18.85Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		</g>
		<g class="users-side users-side-right">
			<path class="users-side-whole" d="M23.05 18.85V15.85A3.4 3.4 0 0 0 19.65 12.45H18.45A3.4 3.4 0 0 0 15.79 13.73A5.5 5.5 0 0 1 16.2 15.8V18.85A1.6 1.6 0 0 1 15.92 19.75H22.15A.9.9 0 0 0 23.05 18.85Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
			<path d="M16.4 8.95a2.65 2.65 0 1 0 5.3 0a2.65 2.65 0 1 0-5.3 0Z M23.05 18.85V15.85A3.4 3.4 0 0 0 19.65 12.45H18.45A3.4 3.4 0 0 0 17.9 12.5A5.5 5.5 0 0 1 19 15.8V18.85A1.6 1.6 0 0 1 18.72 19.75H22.15A.9.9 0 0 0 23.05 18.85Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		</g>
		<path d="M8.45 6.5a3.55 3.55 0 1 0 7.1 0a3.55 3.55 0 1 0-7.1 0Z M5.7 18.85V15.8A4.8 4.8 0 0 1 10.5 11H13.5A4.8 4.8 0 0 1 18.3 15.8V18.85A.9.9 0 0 1 17.4 19.75H6.6A.9.9 0 0 1 5.7 18.85Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
	</symbol>
	<!-- A screen on a stand, standing on the same y 19.75 as the others. The heart line is drawn three
	     periods long inside a nested svg that clips it to the display, a window inset from the screen
	     edge; a clipPath would not render from the desk's hidden symbol container, a nested svg does.
	     Its size is also set inline because the dock and header size every svg they hold. -->
	<symbol viewBox="0 0 24 24" id="icon-system-monitor-duotone" stroke="none" style="overflow: visible">
		<path d="M2 4.75A1.8 1.8 0 0 1 3.8 2.95H20.2A1.8 1.8 0 0 1 22 4.75V13.7A1.8 1.8 0 0 1 20.2 15.5H3.8A1.8 1.8 0 0 1 2 13.7Z" style="fill: var(--duotone-dark, light-dark(var(--ink-gray-5), var(--ink-gray-6)))" />
		<path d="M10.5 16.2H13.5V17.45A.5.5 0 0 0 14 17.95H15.9A.9.9 0 0 1 16.8 18.85A.9.9 0 0 1 15.9 19.75H8.1A.9.9 0 0 1 7.2 18.85A.9.9 0 0 1 8.1 17.95H10A.5.5 0 0 0 10.5 17.45Z" style="fill: var(--duotone-light, var(--ink-gray-3))" />
		<svg x="3.2" y="4.5" width="17.6" height="9.5" viewBox="3.2 4.5 17.6 9.5" style="width: 17.6px; height: 9.5px; overflow: hidden"><path class="system-trace" d="M-3.69 10.15L-2.45 7.73L-0.09 13.85L0.68 13.89L2.61 10.15L9.31 10.15L10.55 7.73L12.91 13.85L13.68 13.89L15.61 10.15L22.31 10.15L23.55 7.73L25.91 13.85L26.68 13.89L28.61 10.15L35.31 10.15L36.55 7.73L38.91 13.85L39.68 13.89L41.61 10.15L44.45 10.15L44.45 8.65L40.69 8.65L39.45 11.07L37.09 4.95L36.32 4.91L34.39 8.65L27.69 8.65L26.45 11.07L24.09 4.95L23.32 4.91L21.39 8.65L14.69 8.65L13.45 11.07L11.09 4.95L10.32 4.91L8.39 8.65L1.69 8.65L0.45 11.07L-1.91 4.95L-2.68 4.91L-4.61 8.65L-7.55 8.65L-7.55 10.15Z" style="fill: var(--duotone-light, var(--ink-gray-3))" /></svg>
	</symbol>
</svg>
