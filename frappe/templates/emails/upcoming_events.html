{% for e in events %}
<p>
	<span class="text-bold">{{ e.starts_on }}: </span><span>{{ e.subject }}</span>
	{% if e.description %}<br><span class="text-muted">{{ e.description }}</span>{% endif %}
</p>
{% endfor %}
<p class="more-info">
	{{ _("Daily Event Digest is sent for Calendar Events where reminders are set.") }}
</p>
