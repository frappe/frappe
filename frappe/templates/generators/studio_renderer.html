<!DOCTYPE html>
<!-- Built with Frappe Studio -->
<html lang="en" class="h-full">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" href="{{ favicon or '/assets/frappe/studio/favicon.png' }}" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>{{ app_title }}</title>
		{% if not is_developer_mode and assets %}
			<script type="module" crossorigin src="{{ assets.script }}"></script>
			{% for preload in assets.preloads %}
				<link rel="modulepreload" crossorigin href="{{ preload }}" />
			{% endfor %}
			{% for stylesheet in assets.stylesheets %}
				<link rel="stylesheet" crossorigin href="{{ stylesheet }}" />
			{% endfor %}
		{% endif %}
	</head>
	<body class="h-full">
		<div id="app" class="h-full"></div>
		<div id="modals"></div>
		<div id="popovers"></div>
		<script>
			window.boot = {{ boot|tojson }};
			window.csrf_token = "{{ csrf_token }}";
			window.site_name = "{{ site_name }}";
			window.is_preview = "{{ is_preview }}";
			window.app_name = "{{ app_name }}";
			window.app_route = "{{ app_route }}";
			window.app_title = "{{ app_title }}";
			window.frappe_app = "{{ frappe_app }}";
			window.app_pages = {{ app_pages|tojson }};
			window.app_home = {{ app_home|tojson }};
			window.router_script = {{ router_script|tojson }};
			window.router_file = {{ router_file|tojson }};
			window.is_guest = {{ is_guest|tojson }};
			window.is_developer_mode = {{ is_developer_mode }};
		</script>
		{% if is_developer_mode %}
			<!-- the editor's vite dev server serves the renderer with HMR; protocol-relative so it loads over the page's own scheme -->
			<script type="module" src="//{{ vite_dev_server_host }}/@vite/client"></script>
			<script type="module" src="//{{ vite_dev_server_host }}/src/renderer.ts"></script>
		{% elif not assets %}
			<script>
				console.error("The Studio renderer is not built. Run `bench build --app frappe`.")
			</script>
		{% endif %}

		{% if assets_not_found %}
		<script>
			console.error("Could not find app assets for Studio App. Currently, using the default renderer as a fallback. Please publish the app again to generate assets.")
		</script>
		{% endif %}
	</body>
</html>
