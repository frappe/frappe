{% extends "templates/print_format/macros/Data.html" %}

{%- block value -%}
{%- if legacy -%}
<div class="value">
    <img class="w-100" src="{{ value }}" alt="{{ _(df.label) }}">
</div>
{%- else -%}
<div class="value">
    <img src="{{ value|e }}" alt="{{ _(df.label)|e }}" style="max-width: 100%;{% if df.width %} width: {{ df.width|e }};{% else %} width: 100%;{% endif %}">
</div>
{%- endif -%}
{%- endblock -%}
