<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ 'rtl' if is_rtl() else 'ltr' }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ title }}</title>
	<link href="{{ bundled_asset('print.bundle.css') }}" rel="stylesheet">
	<style>
		{{ print_css }}
	</style>
</head>
<body>
	<div class="print-format-gutter">
		<div class="print-format {% if landscape %}landscape{% endif %} {% if use_smaller_font %}smaller-font{% endif %}">
			{% if letter_head and letter_head.header %}
			<div {% if repeat_header_footer %} id="header-html" class="hidden-pdf" {% endif %}>
				<div class="letter-head">{{ letter_head.header }}</div>
			</div>
			{% endif %}
			{{ content }}
			{% if repeat_header_footer %}
			<div id="footer-html" class="visible-pdf">
				{% if letter_head and letter_head.footer %}
					<div class="letter-head-footer">
						{{ letter_head.footer }}
					</div>
				{% endif %}
				<p class="text-center small page-number visible-pdf">
					{{ _("Page {0} of {1}").format('<span class="page"></span>', '<span class="topage"></span>') }}
				</p>
			</div>
			{% endif %}
		</div>
	</div>
</body>
</html>
