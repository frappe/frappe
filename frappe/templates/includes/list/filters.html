<div class="website-list-filters my-4">
	<div class="row">
		<div class="col-6">
			<form class="d-flex flex-wrap align-items-center form-search" action="/{{ pathname | urlencode }}">
				<div class="input-group">
					<input class="form-control" doctype="text" name="txt"
						placeholder="Search..." value="{{ (txt or '') | e }}">
					<button class="btn btn-light" type="submit">
						<span class="desktop-search-icon">
							<svg class="icon icon-xs"><use href="#icon-search"></use></svg>
						</span>
					</button>
				</div>
			</form>
		</div>
	</div>
	{% if txt %}
		<div class="filter-message small text-muted">
			Results filtered by <b>{{ txt | e }}</b>.
		</div>
	{% endif %}
</div>
