exclude: 'node_modules|.git'
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, commit-msg]
fail_fast: false

# The check-ast and debug-statements hooks must parse PEP 695 generics,
# so they need Python >= 3.12. The system default is 3.10.
default_language_version:
  python: python3.12

# The Frappe app is the repository root and harness/ is the flow server; each tree keeps
# the tool versions it is formatted with, so hooks are scoped by path.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: "flow.*"
        exclude: "^harness/|.*json$|.*txt$|.*csv|.*md|.*svg"
      - id: trailing-whitespace
        name: trailing-whitespace (harness)
        files: "^harness/"
        exclude: ".*json$|.*txt$|.*csv|.*md|.*svg"
      - id: no-commit-to-branch
        args: ['--branch', 'develop', '--branch', 'main']
      - id: check-merge-conflict
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff
        name: "Run ruff import sorter"
        args: ["--select=I", "--fix"]
        exclude: "^harness/"

      - id: ruff
        name: "Run ruff linter"
        exclude: "^harness/"

      - id: ruff-format
        name: "Run ruff formatter"
        exclude: "^harness/"

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        name: "Run ruff import sorter (harness)"
        args: ["--select=I", "--fix"]
        files: "^harness/"

      - id: ruff
        name: "Run ruff linter (harness)"
        files: "^harness/"

      - id: ruff-format
        name: "Run ruff formatter (harness)"
        files: "^harness/"

  - repo: local
    hooks:
      - id: ty
        name: "Run ty (harness)"
        entry: uv run --directory harness --extra dev ty check src
        language: system
        types: [python]
        files: "^harness/src/"
        pass_filenames: false

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v2.7.1
    hooks:
      - id: prettier
        types_or: [javascript, vue, scss]
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                harness/.*|
                flow/public/dist/.*|
                .*node_modules.*|
                .*boilerplate.*|
                flow/templates/includes/.*|
                flow/public/js/lib/.*
            )$


  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.44.0
    hooks:
      - id: eslint
        types_or: [javascript]
        args: ['--quiet']
        # Ignore any files that might contain jinja / bundles
        exclude: |
            (?x)^(
                harness/.*|
                flow/public/dist/.*|
                cypress/.*|
                .*node_modules.*|
                .*boilerplate.*|
                flow/templates/includes/.*|
                flow/public/js/lib/.*
            )$

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.23.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['conventional-changelog-conventionalcommits']

ci:
    autoupdate_schedule: weekly
    # `uv` is not available on the hosted pre-commit.ci runners, so the local
    # ty hook cannot run there. It still runs locally, which is where the check gates commits.
    skip: [ty]
    submodules: false
