<!doctype html>
<!-- diagram.mjs puts the data in DATA. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<title></title>
<link rel="stylesheet" href="/assets/frappe/css/espresso/colors.css" />
<link rel="stylesheet" href="/assets/frappe/css/espresso/spacing.css" />
<link rel="stylesheet" href="/assets/frappe/css/espresso/radius.css" />
<link rel="stylesheet" href="/assets/frappe/css/espresso/typography.css" />
<link rel="stylesheet" href="/assets/frappe/css/espresso/effects.css" />
<link rel="stylesheet" href="/assets/frappe/css/espresso/components/badge.css" />
<link rel="stylesheet" href="/assets/frappe/css/espresso/components/button.css" />
<style>
	* { box-sizing: border-box; }
	body { margin: 0; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--ink-gray-8, #1f2328); background: var(--surface-gray-1, #f6f7f9); }
	code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--surface-gray-2, #eef0f3); padding: 0 3px; border-radius: 3px; }
	a { color: var(--ink-blue-8, #0b5cad); text-decoration: none; }
	a:hover { text-decoration: underline; }
	header { display: flex; gap: 16px; align-items: center; padding: 10px 16px; background: var(--surface-base, #fff); border-bottom: 1px solid var(--outline-gray-2, #dde1e6); flex-wrap: wrap; }
	header h1 { font-size: 15px; margin: 0; }
	.stats { display: flex; gap: 12px; color: var(--ink-gray-6, #57606a); }
	.stats b { color: var(--ink-gray-8, #1f2328); }
	.stats .red b { color: var(--ink-red-7, #c62828); }
	main { display: flex; height: calc(100vh - 49px); }
	#view { flex: 1; overflow: auto; padding: 14px 16px 80px; }
	#panel { width: 380px; border-left: 1px solid var(--outline-gray-2, #dde1e6); background: var(--surface-base, #fff); overflow: auto; padding: 14px 16px 80px; }
	#panel h2 { font-size: 15px; margin: 0 0 4px; }
	#panel h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-gray-6, #57606a); margin: 16px 0 6px; }
	#panel table { border-collapse: collapse; width: 100%; }
	#panel td { border-top: 1px solid var(--outline-gray-1, #eef0f3); padding: 3px 4px; vertical-align: top; }
	#panel .muted { color: var(--ink-gray-6, #57606a); }
	#panel code { word-break: break-all; }
	.es-badge { margin: 1px 2px 1px 0; }
	/* Plain looks for .es-badge and .es-button when /assets/ is not served (file opened from disk).
	   :where() gives them no weight, so Espresso's own rules win whenever they load. */
	:where(.es-badge) { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 9px; background: var(--surface-gray-2, #eef0f3); }
	:where(.es-badge[data-theme="red"]) { background: var(--surface-red-2, #fde2e1); color: var(--ink-red-8, #b3261e); }
	:where(.es-badge[data-theme="green"]) { background: var(--surface-green-2, #e3f4e8); color: var(--ink-green-8, #1a7f37); }
	:where(.es-badge[data-theme="blue"]) { background: var(--surface-blue-2, #e1ecfb); color: var(--ink-blue-8, #0b5cad); }
	:where(.es-badge[data-theme="amber"]) { background: var(--surface-amber-2, #fff3cd); color: var(--ink-amber-8, #7a5b00); }
	:where(.es-button) { border: 1px solid var(--outline-gray-2, #dde1e6); background: var(--surface-base, #fff); color: inherit; border-radius: 6px; padding: 4px 10px; cursor: pointer; font: inherit; }
	:where(.es-button[data-variant="solid"]) { background: var(--surface-gray-10, #1f2328); color: var(--ink-base, #fff); border-color: var(--outline-gray-8, #1f2328); }
	.legend { display: flex; gap: 14px; margin: 0 0 10px; color: var(--ink-gray-6, #57606a); flex-wrap: wrap; align-items: center; }
	.legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid; vertical-align: middle; margin-right: 4px; }
	.legend label { cursor: pointer; }
	svg text { font-size: 11px; pointer-events: none; }
	.box rect { stroke: var(--outline-base, #fff); stroke-width: 1; cursor: pointer; }
	.box.dim { opacity: .25; }
	.box.sel rect { stroke: var(--outline-gray-8, #1f2328); stroke-width: 2; }
	.box.loop rect { stroke: var(--orange-600, #e36209); stroke-width: 2; stroke-dasharray: 4 2; }
	.layerlabel { cursor: pointer; }
	.layerlabel:hover rect { fill: var(--surface-gray-3, #e7eaee); }
	.edge { fill: none; }
	.edge.hit { stroke: transparent; stroke-width: 9; cursor: pointer; }
	/* matrix */
	table.matrix { border-collapse: collapse; }
	table.matrix th, table.matrix td { border: 1px solid var(--outline-gray-2, #dde1e6); padding: 4px 6px; text-align: center; min-width: 46px; }
	table.matrix th { background: var(--surface-base, #fff); font-weight: 600; font-size: 12px; }
	table.matrix th.row { text-align: left; }
	table.matrix td.may { background: var(--surface-green-1, #f0faf3); }
	table.matrix td.no { background: var(--surface-gray-1, #f6f7f9); }
	table.matrix td.self { background: var(--surface-gray-2, #eef0f3); }
	table.matrix td.bad { background: var(--surface-red-3, #fbd3d0); color: var(--ink-red-8, #b3261e); font-weight: 700; }
	table.matrix td.has { cursor: pointer; }
	table.matrix td.has:hover { outline: 2px solid var(--outline-gray-8, #1f2328); }
	/* flow */
	.flowtabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
	.flow { display: grid; grid-template-columns: minmax(320px, 1fr) 300px; gap: 16px; }
	.step { background: var(--surface-base, #fff); border: 1px solid var(--outline-gray-2, #dde1e6); border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; cursor: pointer; }
	.step.on { border-color: var(--outline-gray-8, #1f2328); box-shadow: 0 0 0 1px var(--outline-gray-8, #1f2328); }
	.step .n { font-weight: 700; margin-right: 6px; }
	.stack div { border-radius: 5px; padding: 6px 10px; margin-bottom: 4px; background: var(--surface-base, #fff); border: 1px solid var(--outline-gray-2, #dde1e6); color: var(--ink-gray-4, #8c959f); }
	.stack div.lit { color: var(--ink-base, #fff); border-color: transparent; }
	/* extension points */
	.ext { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
	.ext h2 { font-size: 13px; margin: 0 0 8px; }
	.card { background: var(--surface-base, #fff); border: 1px solid var(--outline-gray-2, #dde1e6); border-left-width: 4px; border-radius: 6px; padding: 6px 10px; margin-bottom: 6px; cursor: pointer; }
	.card.pairhit { outline: 2px solid var(--orange-600, #e36209); }
	.card .pair { color: var(--orange-600, #e36209); font-size: 11px; }
	/* switcher */
	#switcher { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: var(--surface-gray-10, #1f2328); color: var(--ink-base, #fff); padding: 6px 8px; border-radius: 22px; box-shadow: 0 6px 20px var(--black-200, rgba(0,0,0,.25)); z-index: 10; }
	#switcher .es-button { background: transparent; color: var(--ink-base, #fff); border: 0; gap: 0; padding: 0; width: 30px; height: 30px; border-radius: 15px; }
	#switcher .es-button:hover { background: var(--surface-gray-9, #3a3f45); }
	#switcher .icon { width: calc(var(--spacing, 0px) * 4); fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
	/* The ‹ › text stands in for the sprite icon when /assets/ is not served. --spacing comes
	   from Espresso's spacing.css, so .icon and .alt each collapse to 0 in the other case. */
	#switcher .alt { font-size: max(0px, 16px - var(--spacing, 0px) * 99); }
	#label { min-width: 210px; text-align: center; font-weight: 600; }
</style>
</head>
<body>
<header>
	<h1 id="title"></h1>
	<div class="stats" id="stats"></div>
</header>
<main>
	<div id="view"></div>
	<aside id="panel"></aside>
</main>
<div id="switcher">
	<button id="prev" class="es-button" data-variant="ghost"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="/assets/frappe/icons/lucide/icons.svg#icon-chevron-left"></use></svg><span class="alt">‹</span></button>
	<span id="label"></span>
	<button id="next" class="es-button" data-variant="ghost"><svg class="icon" width="16" height="16" aria-hidden="true"><use href="/assets/frappe/icons/lucide/icons.svg#icon-chevron-right"></use></svg><span class="alt">›</span></button>
</div>
<script>
const MESSAGES = /*MESSAGES*/{};
const DATA = /*DATA*/null;
/*SCRIPTS*/
</script>
</body>
</html>
